palette = "noctalia"
format = """\
[╭╴](fg:teal)\
$username\
$directory\
$time\
(\
    $git_branch\
    $git_status\
)\
$cmd_duration
[╰─](fg:teal)$character\
"""

add_newline = true

[username]
style_user = 'subtext1'
style_root = 'red'
format = '[]($style)[  Hiram](bg:$style fg:crust)[]($style)'
disabled = false
show_always = true

[character]
success_symbol = "[󰍟](fg:teal)"
error_symbol = "[󰍟](fg:red)"

[directory]
format = " [](fg:surface1)[  $path ]($style)[$read_only]($read_only_style)[](fg:surface1)"
truncation_length = 3
style = "fg:text bg:surface1"
read_only_style = "fg:text bg:surface1"
before_repo_root_style = "fg:text bg:surface1"
truncation_symbol = "…/"
truncate_to_repo = true
read_only ="  "

[directory.substitutions]
"Escritorio" = "  "
"Documentos" = "  "
"Descargas" = "  "
"Música" = " 󰎈"
"Imágenes" = "  "
"Vídeos" = "  "
"Proyectos" = " 󰊤 "

[time]
disabled = false
format = " [](fg:overlay1)[ $time]($style)[](fg:overlay1)"
time_format = "%H:%M"
style = "fg:text bg:overlay1"

[cmd_duration]
format = " [](fg:overlay1)[ $duration]($style)[](fg:overlay1)"
style = "fg:text bg:overlay1"
min_time = 500

[git_branch]
format = " [](fg:sapphire)[$symbol$branch](fg:crust bg:sapphire)[](fg:sapphire)"
symbol = " "

[git_status]
format = '([ ](fg:surface1)[ $modified$new$deleted$renamed$untracked$ahead_behind ]($style)[](fg:surface1))'
style = "fg:text bg:surface1"
modified = "✘"

[package]
disabled = true

