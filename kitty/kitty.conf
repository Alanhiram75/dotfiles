# Font
font_family      JetBrains Mono Nerd Font
font_size 13.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (consistency with foot)
window_margin_width 21.75

# No close confirmation
confirm_os_window_close 0

# No active/inactive border color change on focus
active_border_width 0

# Remote control (para toggle de color/opacidad en pantalla completa)
allow_remote_control yes
dynamic_background_opacity yes
# kitty añade el PID al nombre del socket (kitty.sock-<pid>): sin conflictos entre instancias
listen_on unix:/run/user/1000/kitty.sock

# Use fish shell
shell fish

# Colores dinámicos del tema noctalia (auto-generado al cambiar wallpaper)

# Copy
map ctrl+c    copy_or_interrupt

# Search (nativa, el kitten search.py se eliminó en kitty 0.48)
map ctrl+f search_scrollback
map ctrl+shift+f search_scrollback

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# Opacity
background_opacity 0.4

# No window decorations (floating look)
hide_window_decorations yes
include themes/noctalia.conf

# Scrollbar desactivada
scrollbar never
